# ─────────────────────────────────────────────────────────────────────────────
# Antigen — scheduled metadata prompt-injection scan.  COPY THIS INTO YOUR REPO.
#
# This is a TEMPLATE FOR ADOPTERS, not Antigen's own pipeline (that is
# .github/workflows/ci.yml, which tests Antigen itself). Drop this file into
# .github/workflows/ of the repo that owns your DataHub metadata, set the two
# secrets below, and you have a nightly read-only sweep that fails loudly when
# someone plants an injection in a description an agent will read.
#
# READ-ONLY BY CONSTRUCTION. `scan` and `rescan` never call a mutation tool —
# but do not rely on that alone, and do not rely on an env var either. There is
# no `TOOLS_IS_MUTATION_ENABLED` / `SAVE_DOCUMENT_TOOL_ENABLED` switch that does
# anything: in datahub-agent-context 1.6.0.17 those names appear only in a module
# docstring and are never read, and the mutation tools are bound by the
# `include_mutations=True` kwarg in the library call. The control that actually
# holds is the CREDENTIAL: mint the PAT this job uses on a DataHub account with
# NO `EDIT_*` privilege (see "Least privilege" in Antigen's docs/DEPLOYMENT.md), so a write
# would be refused by the server rather than by a flag.
#
# Remediation (`antigen cure`) is deliberately NOT in this workflow. It rewrites
# catalog text and belongs behind a human, with `--dry-run` first and
# `--max-mutations` set. See "Running Antigen on your own catalog" in the README.
#
# TWO sweeps, not one, and BOTH gate the job. `scan` skips entities already
# tagged `injection-quarantined` — that skip is what makes `scan && cure` safe to
# re-run, and it also means a cured entity that an attacker RE-poisons is
# invisible to `scan` forever. `rescan` is the half that sees it: every cured or
# certified entity carries an `antigen.contentSha256` stamp, and rescan reports
# any whose content no longer hashes to it. Run only `scan` and the steady state
# this product is designed to reach — a catalog where everything is cured or
# certified — is exactly the state it stops watching.
#   (`python -m antigen scan --include-quarantined` forces the full re-sweep in
#   one command instead; it costs a detector pass over every cured field, which
#   is why the drift check is the scheduled one.)
# ─────────────────────────────────────────────────────────────────────────────
name: Metadata injection scan

on:
  schedule:
    # 07:00 UTC daily. Pick a time your GMS is reachable and its search index is
    # warm; DataHub indexes asynchronously and a cold index under-enumerates.
    - cron: "0 7 * * *"
  workflow_dispatch: {}

# No write access to the repo is needed either.
permissions:
  contents: read

jobs:
  scan:
    name: Sweep the catalog for prompt injections
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATAHUB_GMS_URL: ${{ secrets.DATAHUB_GMS_URL }}
      # A PAT for a READ-ONLY service account. See the README's least-privilege
      # section for the exact DataHub Policy to create.
      DATAHUB_GMS_TOKEN: ${{ secrets.DATAHUB_GMS_READONLY_TOKEN }}

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Antigen (live extras)
        run: pip install "antigen-datahub[live] @ git+https://github.com/edycutjong/antigen@main"

      - name: Scan
        id: scan
        # `set +e` so the step can inspect the exit code instead of dying on it.
        # stdout is the JSON report; stderr carries the DEGRADED warnings.
        run: |
          set +e
          python -m antigen scan --fail-on-hit --json > antigen-report.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      # Uploaded BEFORE the gate below, and with if: always(), so the report
      # survives the failing run that produced it — that is the whole point of
      # keeping it as an artifact.
      - name: Upload the JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antigen-report
          path: antigen-report.json
          retention-days: 30

      # The half `scan` cannot see. A cured entity carries the
      # `injection-quarantined` tag, so `scan` skips it; if someone rewrites its
      # description with a fresh payload, only the content-hash drift check
      # notices. Same exit-code contract as `scan`: 1 = drift found,
      # 2 = degraded sweep.
      - name: Rescan for drift on cured and certified entities
        id: rescan
        if: always()
        run: |
          set +e
          python -m antigen rescan --fail-on-hit
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          set -e

      - name: Interpret the exit codes
        # `always()` so a failing scan step cannot skip the interpretation that
        # explains it.
        if: always()
        run: |
          fail=0
          interpret() {
            what="$1"; code="$2"
            case "$code" in
              0)
                echo "::notice::Antigen ${what}: nothing found."
                ;;
              1)
                # A WORKING sweep that found something. The catalog is dirty: an
                # agent reading these descriptions is reading attacker text today.
                echo "::error::Antigen ${what}: FINDINGS in catalog metadata."
                echo "Triage: download the antigen-report artifact, then preview the"
                echo "remediation with 'python -m antigen cure --dry-run'."
                fail=1
                ;;
              2)
                # NOT an all-clear, and NOT the same alarm as exit 1. A dead or
                # misconfigured GMS returns an empty catalog that is
                # indistinguishable on the wire from a clean one, so Antigen fails
                # closed — and every infrastructure failure (unreachable host,
                # missing extras, an unencodable response) is mapped here too,
                # never to 1. Folding 2 into a generic non-zero handler would
                # report "injections found" for what is actually a broken sweep —
                # and, worse, a green-looking pipeline would otherwise mean nothing.
                echo "::error::Antigen ${what}: DEGRADED SWEEP — could not establish anything."
                echo "This is an infrastructure failure, not a finding. Check"
                echo "DATAHUB_GMS_URL / DATAHUB_GMS_TOKEN reachability and the tool"
                echo "env flags, then re-run. Do NOT treat this run as a pass."
                fail=1
                ;;
              *)
                echo "::error::Antigen ${what}: unexpected exit code ${code}."
                fail=1
                ;;
            esac
          }
          interpret "scan (new injections)" "${{ steps.scan.outputs.exit_code }}"
          interpret "rescan (drift on cured/certified entities)" "${{ steps.rescan.outputs.exit_code }}"
          exit $fail
