name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ── STAGE 1: Code Quality (parallel with Stage 2) ─────────
  quality:
    name: "Stage 1 · Code Quality"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Full matrix on main push, single interpreter on PRs (saves minutes).
        python-version: ${{ github.event_name == 'push' && fromJSON('["3.10","3.11","3.12"]') || fromJSON('["3.11"]') }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
      - name: Install (dev extras)
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy — advisory)
        run: mypy antigen
        continue-on-error: true
      - name: Unit tests with coverage (100% gate)
        run: pytest --cov=antigen --cov-report=xml --cov-report=term --cov-fail-under=100
      - name: Upload coverage report
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7
          if-no-files-found: ignore

  # ── STAGE 2: Security Gate (parallel with Stage 1) ────────
  secret-scan:
    name: "Stage 2 · Secret Scanning"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          # `--exclude-detectors=lob` — one detector, disabled for cause, not a
          # blanket loosening. TruffleHog's Lob rule matches `test_[A-Za-z0-9_]{35}`
          # and its verifier returns Verified=true for ANY string of that shape:
          # `test_` followed by 35 literal `a` characters is reported as a verified
          # secret. Python test names land on that pattern by accident (a 35-character
          # `test_…` function name is unremarkable), so here the rule can only ever
          # produce false positives — this project has no Lob (direct-mail API)
          # integration, credential, or dependency of any kind. Every other detector
          # stays enabled, still gated on --only-verified.
          extra_args: --only-verified --exclude-detectors=lob

  dependency-audit:
    name: "Stage 2 · Dependency Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
      - name: pip-audit (dev + live extras)
        run: |
          pip install pip-audit
          # Core is stdlib-only; audit the declared optional dependency sets.
          pip-audit --desc || true
        continue-on-error: true

  # ── STAGE 3: Verify (the reproducible proof — build/e2e equivalent) ──
  verify:
    name: "Stage 3 · Verify (graph-state proof)"
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: verify.py Part A graph-state gate
        run: python verify.py
      - name: The hero-arc demo (offline)
        run: python -m antigen demo --offline
      - name: Near-miss false-positive gauntlet
        run: python seed_near_miss.py
      - name: examples/ are in sync with the corpus
        run: |
          python scripts/generate_examples.py
          git diff --exit-code -- examples/ \
            || (echo "::error::examples/ is stale — run scripts/generate_examples.py" && exit 1)

  # ── STAGE 5: Performance ──────────────────────────────────
  performance:
    name: "Stage 5 · Performance (benchmark)"
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Benchmark (p50/p95/p99, methodology shown)
        run: python bench.py --runs 20

  # ── STAGE 6: Semantic Release (main only) ─────────────────
  # Reads Conventional Commits since the last tag and, if a release is warranted,
  # bumps pyproject version, regenerates CHANGELOG.md, tags vX.Y.Z, and cuts a
  # GitHub Release. The release commit carries [skip ci] so it won't re-trigger.
  release:
    name: "Stage 6 · Semantic Release"
    needs: [verify, performance, secret-scan, dependency-audit]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write # push the version-bump commit, tag, and GitHub Release
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so commit analysis can find the last tag
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # ── STAGE 7: Deploy web/ to Vercel (prod, main only) ──────
  # Deploys the static marketing site in web/ to Vercel production. .vercel/ is
  # gitignored, so linkage comes from repo secrets via `vercel pull`.
  # Required GitHub repo secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
  deploy:
    name: "Stage 7 · Deploy web/ → Vercel (prod)"
    needs: [release]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://antigen.edycu.dev # canonical custom domain, not the per-deploy vercel.app URL
    defaults:
      run:
        working-directory: web
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # deploy the version-bumped HEAD produced by the release job
          fetch-depth: 0 # need tags so the release badge can be stamped from git describe
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Vercel CLI
        run: npm install -g vercel@latest
      - name: Stamp release version into the landing-page badge
        run: |
          ver=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$ver" ]; then
            sed -i -E "s#(class=\"ver-tag\"[^>]*>)v[0-9]+\.[0-9]+\.[0-9]+#\1${ver}#" index.html
            echo "Stamped release badge with $ver"
          else
            echo "No tag found; leaving committed badge version"
          fi
      - name: Link project & pull prod env
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build (static)
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy prebuilt to production
        id: deploy
        run: |
          # `vercel deploy` prints the production URL within seconds, then keeps polling
          # until the deployment is READY — which can stall the runner for many minutes.
          # The prebuilt output is already uploaded once the URL is printed, so cap the
          # wait and treat a captured URL as success.
          #
          # Two distinct non-success outcomes are separated here, because collapsing them
          # is what put a red X on a green main. The step used to `exit 1` on any missing
          # URL under the message "No Vercel deployment URL captured", which is a
          # diagnosis, not an observation — the actual log said:
          #
          #   Error: Resource is limited - try again in 24 hours
          #   (more than 100, code: "api-deployments-free-per-day")
          #
          # That is the Vercel Hobby plan's 100-deploys-per-day account quota, hit after a
          # heavy push day. It is not a defect in this repo, nothing was broken, and the
          # previously deployed site stays live and serving — so it is reported as a
          # WARNING and the job continues. Every other failure still fails the job, and
          # the stage is never skipped.
          set +e
          timeout 240 vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" > deploy.log 2>&1
          rc=$?
          cat deploy.log
          # Widened: match any host under vercel.app (scoped/preview hosts included), and
          # read it from a file so a `timeout` kill still leaves the partial output behind.
          url=$(grep -Eoi 'https://[A-Za-z0-9._-]+\.vercel\.app' deploy.log | tail -n1)
          if [ -z "$url" ] && grep -qi 'api-deployments-free-per-day\|Resource is limited' deploy.log; then
            echo "::warning::Vercel free-tier deploy quota reached (100/day) — deployment SKIPPED by the provider, not failed. The previously deployed site remains live at https://antigen.edycu.dev. Re-run this job after the quota window resets."
            echo "quota_exceeded=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$url" ]; then
            echo "::error::Vercel deploy produced no deployment URL (exit ${rc}). See the log above."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "🚀 Deployed web/ to production: $url"
      - name: Pipeline summary
        run: |
          echo "## 🚀 Shipped" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release cut: \`${{ needs.release.outputs.released }}\` (version \`${{ needs.release.outputs.version }}\`)" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.deploy.outputs.quota_exceeded }}" = "true" ]; then
            echo "- Production URL: **deploy skipped — Vercel free-tier quota (100/day) reached**; https://antigen.edycu.dev still serves the previous deployment" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Production URL: ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
          fi
